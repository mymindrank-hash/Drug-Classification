name: Manual / Dedicated CD Deployment

on:
  workflow_dispatch:
    inputs:
      target_space:
        description: "Hugging Face Space ID (optional, defaults to secret HF_SPACE_ID)"
        required: false
        type: string

jobs:
  deploy-static-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ inputs.target_space || secrets.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::error title=Missing Secrets::HF_TOKEN or HF_SPACE_ID is not configured. Please configure them in GitHub Secrets or supply target_space in workflow dispatch."
            exit 1
          fi
          python -m pip install --upgrade huggingface_hub
          hf auth login --token "$HF_TOKEN"
          hf upload "$HF_SPACE_ID" app/ . \
            --repo-type space \
            --commit-message "Manual deploy of ONNX Web application"
          hf upload "$HF_SPACE_ID" model/ model \
            --repo-type space \
            --commit-message "Manual upload of trained models"
          hf upload "$HF_SPACE_ID" results/ results \
            --repo-type space \
            --commit-message "Manual upload of evaluation results"
